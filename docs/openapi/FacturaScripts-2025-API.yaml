          in: query
          schema:
            type: string
          description: Código de idioma a emplear en la exportación.
      responses:
        '200':
          description: Documento generado.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
